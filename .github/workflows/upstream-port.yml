name: Upstream port

# Renovate opens renovate/upstream-laya when NandhaKishorM/laya tags a release
# (see renovate.json). This job ports that release with Claude Code, which only
# commits; the job pushes the result as the maintainer, so CI runs on it, and labels
# it port-ready when complete, for upstream-release.yml to merge and tag.
# When CI fails on the port's commit, ci-heal.yml starts this again with fix_run:
# Claude fixes the failure, or the failed jobs are rerun when it is not the port's.

on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      fix_run:
        description: Failed CI run to fix (set by ci-heal.yml)
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: upstream-port
  cancel-in-progress: false

env:
  BRANCH: renovate/upstream-laya

jobs:
  # A fix (fix_run) needs the port's commit on the branch, with at most five fixing
  # commits; without it the port runs from the start.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        env:
          FIX_RUN: ${{ inputs.fix_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true mode=port
          # CI runs twice per push (push and pull_request), so a fix can be asked for twice;
          # the second request finds the first one's commit and has nothing to do.
          if [ -n "$FIX_RUN" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FIX_RUN" --jq .head_sha)" != "$(git rev-parse HEAD)" ]; then
            echo "Run $FIX_RUN is not on the branch head any more."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fixes=$(git log --format=%B origin/main..HEAD | grep -c '^Co-Authored-By: Claude' || true)
          if [ -n "$FIX_RUN" ] && [ "$fixes" -gt 0 ]; then
            mode=fix
            [ "$fixes" -le 5 ] || run=false
          elif [ "$fixes" -gt 0 ]; then
            echo "The port is already on the branch; only a CI failure (fix_run) runs it again."
            run=false
          fi
          { echo "run=$run"; echo "mode=$mode"; } >> "$GITHUB_OUTPUT"

  port:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'renovate/upstream-laya' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner))
    runs-on: macos-26
    timeout-minutes: 300
    env:
      LAYA_MLX_TEST_DEVICE: cpu
      TOKENIZERS_PARALLELISM: "false"
      USE_TF: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Resolve upstream range
        id: range
        run: |
          echo "start=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          pin() { sed -nE 's/^ +ref: ([0-9a-f]{40}) # (v[^ ]+)$/\1 \2/p' | head -1; }
          read -r old_sha old_tag < <(git show origin/main:.github/workflows/ci.yml | pin)
          read -r new_sha new_tag < <(pin < .github/workflows/ci.yml)
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          test -n "$pr" || { echo "No open PR for $BRANCH"; exit 1; }
          {
            echo "old_sha=$old_sha"; echo "old_tag=$old_tag"
            echo "new_sha=$new_sha"; echo "new_tag=$new_tag"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"
          echo "Porting $old_tag ($old_sha) -> $new_tag ($new_sha), PR #$pr"
      - name: Clone upstream with history
        run: |
          git clone --quiet https://github.com/NandhaKishorM/laya .upstream
          git -C .upstream checkout --quiet ${{ steps.range.outputs.new_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -e '.[dev,reference,demo,serve,mcp,structured,llamaindex]'
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The port works on public code only; keep its transcript in the log.
          show_full_output: true
          # Read-only for Claude: the next step pushes, labels and comments as the maintainer.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Renovate (renovate.yml) opens the PR as the maintainer, on a branch in this repository.
          restrict_untrusted_prs: "false"
          claude_args: |
            --model claude-opus-5-5
            --max-turns 400
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,TodoWrite
            --json-schema '{"type":"object","required":["ready","summary"],"properties":{"ready":{"type":"boolean"},"summary":{"type":"string"}}}'
          prompt: |
            Port upstream NandhaKishorM/laya ${{ steps.range.outputs.new_tag }} into this repository.
            ${{ needs.gate.outputs.mode == 'fix' && format('
            The port is already committed on the branch, but CI run {0} failed on it. Fix that
            failure: `gh run view {0} --log-failed` shows what failed. Find the cause, fix it as
            .github/upstream-port.md allows (never by weakening a check or a test), run its
            checks again, then commit and report as it says. If the failure is not the port''s
            (a runner, network or flaky failure), change nothing and say so; the workflow then
            reruns the failed jobs.
            ', inputs.fix_run) || '' }}

            - Repository: ${{ github.repository }}, branch ${{ env.BRANCH }} (already checked out), pull request #${{ steps.range.outputs.pr }}.
            - Current port: ${{ steps.range.outputs.old_tag }} (${{ steps.range.outputs.old_sha }}).
            - Target: ${{ steps.range.outputs.new_tag }} (${{ steps.range.outputs.new_sha }}), cloned with full history in .upstream.
            - The Python environment is installed; uv is on PATH.

            Read .github/upstream-port.md and follow it exactly. In that file OLD/NEW stand for the commits
            above and OLD_VERSION for the current port's version without the leading v.
            Run every command in the foreground and wait for it to finish; the job ends when you answer.
      - name: Push and report as the maintainer
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.MAINTAINER_TOKEN }}
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
          START: ${{ steps.range.outputs.start }}
          PR: ${{ steps.range.outputs.pr }}
          MODE: ${{ needs.gate.outputs.mode }}
          FAILED_RUN: ${{ inputs.fix_run }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$START" ]; then
            # As the maintainer, so the push may change workflow files and starts CI (and
            # upstream-release.yml after it); bypass the checkout's read-only credentials.
            git -c credential.helper= -c http.https://github.com/.extraheader= \
              push -q "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          elif [ "$MODE" = fix ]; then
            # Nothing to change: the failure was not the port's, so try the failed jobs again.
            gh run rerun "$FAILED_RUN" --failed
          fi
          [ "$MODE" = fix ] && kind="CI fix" || kind="port"
          summary=$(jq -r '.summary // empty' <<<"$OUTPUT")
          printf '%s\n\n<sub>Automated %s by Claude Code ([run](%s)).</sub>\n' \
            "${summary:-The $kind did not finish; see the run log.}" "$kind" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/summary.md"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/summary.md" --silent
          # REST, not `gh pr edit`: its GraphQL query needs read:org, which the token lacks.
          labels="repos/$GITHUB_REPOSITORY/issues/$PR/labels"
          if [ "$(jq -r '.ready // false' <<<"$OUTPUT")" = true ]; then
            gh api "$labels" -f 'labels[]=port-ready' --silent
          else
            gh api -X DELETE "$labels/port-ready" --silent 2>/dev/null || true
          fi
